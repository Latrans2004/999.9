name: Discover manganese primary documents (unreviewed)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Download document candidates without secrets
        run: python -m pipeline.manganese_disclosures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manganese-unreviewed-documents-${{ github.run_id }}
          path: .cache/manganese-discover/
          include-hidden-files: true
          retention-days: 90
