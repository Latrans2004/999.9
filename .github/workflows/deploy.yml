name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ''

# Only the built site is deployed; the pipeline is not run here, so a push
# that only touches CSS or a template redeploys in well under a minute.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Unit tests
        run: python -m pytest pipeline/tests -q
      - name: Verify accepted graphite publication against Raw
        run: |
          python -m pipeline.publish_graphite
          git diff --exit-code -- critical-minerals/data data/processed/natural-graphite
      - name: Re-render pages and fail if they are stale
        # The render also rebuilds the globe data and runs its checks
        # (pipeline/globe.py); a failed check fails this step.
        run: |
          python -m pipeline.render
          if ! git diff --quiet -- '*.html' critical-minerals/data/globe              || [ -n "$(git ls-files --others --exclude-standard -- critical-minerals/data/globe)" ]; then
            echo "::error::Rendered pages or globe data differ from what is committed."
            echo "Run 'python -m pipeline.render' locally and commit the result."
            git --no-pager diff --stat -- '*.html' critical-minerals/data/globe
            git ls-files --others --exclude-standard -- critical-minerals/data/globe
            exit 1
          fi

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/configure-pages@v5
      - name: Stage only public site files
        run: |
          python - <<'PY'
          import pathlib, shutil
          out = pathlib.Path('_site')
          out.mkdir()
          for name in ('assets', 'critical-minerals'):
              shutil.copytree(name, out / name)
          for name in ('index.html', '404.html', 'robots.txt', '.nojekyll'):
              shutil.copy2(name, out / name)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
