name: Cobalt source observations (no publication)
on:
  workflow_dispatch:
  push:
    branches: [codex/cobalt-a0]
    paths:
      - pipeline/cobalt_collect.py
      - .github/workflows/cobalt-audit.yml
permissions:
  contents: read
concurrency:
  group: cobalt-source-observations
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Observe twelve bounded query scopes
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python -m pipeline.cobalt_collect --collect
      - name: Verify public files unchanged
        run: git diff --exit-code -- critical-minerals index.html 404.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobalt-auth-${{ github.run_id }}
          path: data/review/cobalt/auth/
          retention-days: 30
